# Fully resolved lock of the environment built by the Dockerfile in this repository
# (PyTorch 2.4.1 on CUDA 12.1, xFormers 0.0.28, lm-evaluation-harness 0.4.4). The Dockerfile
# is the reference implementation; this file pins every package in its transitive closure so
# the same environment can be rebuilt with conda instead of Docker.
#
# Linux x86-64 with an NVIDIA GPU only. The conda section deliberately pins nothing but the
# interpreter: everything of substance is installed by pip, exactly as the Dockerfile does.
# The original environment used CPython 3.9.20.
#
# NOT INCLUDED HERE -- Flash Attention 2.6.3 and its three CUDA extensions
# (rotary_emb, dropout_layer_norm, xentropy_cuda_lib) cannot be installed from PyPI: 2.6.3
# ships as an sdist whose setup.py imports torch, and the three csrc extensions are not
# published at all. Create this environment first, then build them from source following
# step 3 of CONDA.md, which uses the same pins as the Dockerfile.
#
#   conda env create -f environment.yaml
#   conda activate dlm-scaling
#   # then CONDA.md step 3
name: dlm-scaling
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
